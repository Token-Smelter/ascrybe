api_version: example.project-checks/v1

overrides:
  build:
    command: >-
      git ls-files -z -- '*.mjs' |
      bash -c 'while IFS= read -r -d "" file; do node --check "$file" || exit; done' &&
      printf 'ascrybe build: checked Node sources\n'
    input_paths: ["**/*.mjs"]
    evidence:
      execution: { stream: stdout, pattern: "ascrybe build: checked Node sources" }
      cache: { mode: not_applicable }
  tests:
    command: "node scripts/test-fast.mjs"
    input_paths: ["**"]
    evidence:
      execution: { stream: stdout, pattern: "# pass [1-9][0-9]*" }
      cache: { mode: not_applicable }
  design-authority:
    command: "node scripts/check-design-authority.mjs"
    input_paths: ["docs/**", "*.md", "DESIGN-AUTHORITY-*.json", "scripts/*design-authority*.mjs"]
    evidence:
      execution: { stream: stdout, pattern: "design-authority consistency: PASS" }
      cache: { mode: not_applicable }
  lint:
    command: >-
      if output=$(git grep -n -E '[[:blank:]]+$' -- '*.mjs'); then
        printf '%s\n' "$output";
        exit 1;
      else
        status=$?;
        [ "$status" -eq 1 ] || exit "$status";
      fi &&
      printf 'ascrybe lint: checked Node whitespace\n'
    input_paths: ["**/*.mjs"]
    evidence:
      execution: { stream: stdout, pattern: "ascrybe lint: checked Node whitespace" }
      cache: { mode: not_applicable }
