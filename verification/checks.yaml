schema: estate-map/verification-registry/v2

profile_binding:
  path: .catalog/checks.yaml
  api_version: example.project-checks/v1
  checks:
    - { check_id: build, profile_check_id: build }
    - { check_id: tests, profile_check_id: tests }
    - { check_id: lint, profile_check_id: lint }
    - { check_id: design-authority, profile_check_id: design-authority }

gate_discovery:
  boundaries:
    - { root: tools, max_depth: 1 }
    - { root: scripts, max_depth: 1 }
  candidate_pattern: '^(?:tools/[^/]+-exit-gate\.mjs|scripts/check-[^/]+\.mjs)$'
  exclusions: []

checks:
  - id: build
    command: >-
      git ls-files -z -- '*.mjs' |
      bash -c 'while IFS= read -r -d "" file; do node --check "$file" || exit; done' &&
      printf 'ascrybe build: checked Node sources\n'
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: git }
      - { kind: command, name: bash }
      - { kind: command, name: node }
    failure_signature: null
    gate_path: null
    reason: Check syntax for every tracked Node source.
    source_citation: [.catalog/checks.yaml:4-12]
    timeout_seconds: 120

  - id: lint
    command: >-
      if output=$(git grep -n -E '[[:blank:]]+$' -- '*.mjs'); then
        printf '%s\n' "$output";
        exit 1;
      else
        status=$?;
        [ "$status" -eq 1 ] || exit "$status";
      fi &&
      printf 'ascrybe lint: checked Node whitespace\n'
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: git }
      - { kind: command, name: bash }
    failure_signature: null
    gate_path: null
    reason: Refuse trailing whitespace in tracked Node source.
    source_citation: [.catalog/checks.yaml:26-40]
    timeout_seconds: 120

  - id: tests
    command: node scripts/test-fast.mjs
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: node }
    failure_signature: null
    gate_path: null
    reason: Run the hermetic product test battery, including tracked mini-corpus proofs.
    source_citation: [scripts/test-fast.mjs:1-55]
    timeout_seconds: 1200

  - id: identity-candidate-census
    command: node --test tests/identity-candidate-census.test.mjs
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: node }
    failure_signature: null
    gate_path: scripts/check-identity-candidate-census.mjs
    reason: Check that every invented candidate has a counted disposition.
    source_citation: [tests/identity-candidate-census.test.mjs:1-68]
    timeout_seconds: 120

  - id: design-authority
    command: node scripts/check-design-authority.mjs
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: node }
      - { kind: command, name: git }
    failure_signature: null
    gate_path: scripts/check-design-authority.mjs
    reason: Bind all published documentation to current bytes and reachable public commit provenance.
    source_citation: [scripts/check-design-authority.mjs:1-45]
    timeout_seconds: 120

  - id: artifact-hygiene
    command: node scripts/check-artifact-hygiene.mjs --tracked
    category: standard
    expectation: expect_pass
    required_environment:
      - { kind: command, name: node }
      - { kind: command, name: git }
    failure_signature: null
    gate_path: scripts/check-artifact-hygiene.mjs
    reason: Reject oversized or generated tracked artifacts.
    source_citation: [scripts/check-artifact-hygiene.mjs:1-90]
    timeout_seconds: 120
